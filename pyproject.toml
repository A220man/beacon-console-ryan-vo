[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-console"
version = "1.0.0"
description = "Beacon Console — AI Scientist Skills Platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "scientific", "agent", "skills", "genetics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "bcrypt==4.2.0",
    "email-validator==2.2.0",
    "redis==5.1.0",
    "fakeredis==2.21.1",
]
optional-dependencies = {dev = ["pytest==8.3.4", "pytest-asyncio==0.23.7", "pytest-httpx==0.34.0"]}

[project.urls]
Homepage = "https://github.com/A220man/beacon-console-ryan-vo"
Repository = "https://github.com/A220man/beacon-console-ryan-vo"
Issues = "https://github.com/A220man/beacon-console-ryan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"